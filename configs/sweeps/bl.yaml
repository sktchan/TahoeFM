# mlp baseline random search over lr, dropout, depth and width; filled in by scripts/sweep.jl; no early stopping (every trial runs max_steps); Tahoe space (Nov 20): + weight_decay, dropout to .5, width to 4096
program: scripts/baseline.jl
project: ${PROJECT}
name: ${NAME}
method: random
metric:
  name: best_val_acc
  goal: maximize
parameters:
  wandb_project:
    value: ${PROJECT}
  level:
    value: ${LEVEL}
  save_model:
    value: false
  max_steps:
    value: ${MAX_STEPS}
  eval_every:
    value: ${EVAL_EVERY}
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  drop_prob:
    distribution: uniform
    min: 0.0
    max: 0.5
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  n_layers:
    values: [1, 2, 3, 4, 5, 6, 7, 8]
  mlp_hidden_dim:
    values: [256, 512, 1024, 2048, 4096]
${FIXED}
run_cap: 20
command:
  - ${env}
  - julia
  - --threads=1,0
  - ${program}
  - ${CONFIG}
  - ${args_no_hyphens}
