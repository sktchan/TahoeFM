# finetune random search over lr and drop_prob; filled in by scripts/sweep.jl; no early stopping (every trial runs max_steps); Tahoe space (Nov 20): + weight_decay, dropout to .5
program: scripts/finetune.jl
project: ${PROJECT}
name: ${NAME}
method: random
metric:
  name: best_val_acc
  goal: maximize
parameters:
  wandb_project:
    value: ${PROJECT}
  level:
    value: ${LEVEL}
  max_steps:
    value: ${MAX_STEPS}
  eval_every:
    value: 1000
  lr:
    distribution: log_uniform_values
    min: 0.00003
    max: 0.01
  drop_prob:
    distribution: uniform
    min: 0.0
    max: 0.5
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
${FIXED}
run_cap: 20
command:
  - ${env}
  - julia
  - --threads=1,0
  - ${program}
  - ${CONFIG}
  - ${args_no_hyphens}
