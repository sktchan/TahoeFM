# constant-width relu MLP on rank features, each sample's top-1024 genes ((K+1-r)/K over all 19020 genes) (primary)
model = "rmlp"
level = "lvl2"
genes = "topk"
lr = 2.8e-5   # Tahoe sweep ib277ipd best (g8jcdacf); kept over the 150k sweep, author Nov 23
drop_prob = 0.42   # Tahoe sweep ib277ipd best (g8jcdacf); kept over the 150k sweep, author Nov 23
weight_decay = 3.8e-3   # Tahoe sweep ib277ipd best (g8jcdacf); kept over the 150k sweep, author Nov 23
n_layers = 1   # Tahoe sweep ib277ipd best (g8jcdacf); kept over the 150k sweep, author Nov 23
mlp_hidden_dim = 2048   # Tahoe sweep ib277ipd best (g8jcdacf); kept over the 150k sweep, author Nov 23
max_steps = 300000    # TBD: LincsFM final length (300k); the Tahoe length check sets it
