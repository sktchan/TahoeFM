mlp_hidden_dim = 2048     # TBD: LincsFM sweep 3r3k9660 best (cbo6px8c); the Tahoe sweep bl_emlp_z_lvl1 sets it
max_steps = 20000     # TBD: LincsFM final length (20k); the Tahoe length check sets it
