n_layers = 3        # TBD: LincsFM sweep egws2du8 best (0xegjp6v); the Tahoe sweep bl_emlp_z_lvl2 sets it
mlp_hidden_dim = 16384    # TBD: LincsFM sweep egws2du8 best (0xegjp6v); the Tahoe sweep bl_emlp_z_lvl2 sets it
max_steps = 300000    # TBD: LincsFM final length (300k); the Tahoe length check sets it
