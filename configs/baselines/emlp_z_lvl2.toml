# constant-width relu MLP on z-scored expression (clip +-10), hvg panel (primary)
model = "emlp"
level = "lvl2"
genes = "panel"
standardize = true
clip = 10
lr = 2.4e-5   # Tahoe sweep xzppg2r0 best (ow33e2az); kept over the 150k sweep, author Nov 23
drop_prob = 0.37   # Tahoe sweep xzppg2r0 best (ow33e2az); kept over the 150k sweep, author Nov 23
weight_decay = 2.1e-3   # Tahoe sweep xzppg2r0 best (ow33e2az); kept over the 150k sweep, author Nov 23
n_layers = 2   # Tahoe sweep xzppg2r0 best (ow33e2az); kept over the 150k sweep, author Nov 23
mlp_hidden_dim = 1024   # Tahoe sweep xzppg2r0 best (ow33e2az); kept over the 150k sweep, author Nov 23
max_steps = 300000    # TBD: LincsFM final length (300k); the Tahoe length check sets it
