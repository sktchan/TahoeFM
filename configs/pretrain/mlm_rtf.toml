# mlm: 15% of tokens hidden; ETF hides the value and predicts the token's rank, RTF hides the gene and predicts its id; RTF on each sample's top-1024 genes by x / median (Geneformer) (primary arm)
base = "base.toml"
input = "rtf"
tokens = "topk"
top_k = 1024
objective = "mlm"
lr = 0.0027   # TBD: LincsFM config value; the Tahoe pretrain lr grid (pt_mlm_rtf) sets it
drop_prob = 0.0041 # TBD: LincsFM config value, not tuned on Tahoe
mask_ratio = 0.15
