# erecon: value hidden for 30% of tokens (gene visible), per-gene z-scored expression target of each token's own gene; ETF on the hvg panel (primary arm)
base = "base.toml"
input = "etf"
tokens = "panel"
objective = "erecon"
lr = 0.009    # Tahoe pretrain lr grid winner (40k; lowest final val loss)
drop_prob = 0.1 # TBD: LincsFM config value, not tuned on Tahoe
mask_ratio = 0.3
