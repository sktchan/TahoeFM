# erecon: value hidden for 30% of tokens (gene visible), per-gene z-scored expression target of each token's own gene; RTF on each sample's top-1024 genes by x / median (Geneformer) (primary arm)
base = "base.toml"
input = "rtf"
tokens = "topk"
top_k = 1024
objective = "erecon"
lr = 0.003    # Tahoe pretrain lr grid winner (40k; lowest final val loss)
drop_prob = 0.1 # TBD: LincsFM config value, not tuned on Tahoe
mask_ratio = 0.3
